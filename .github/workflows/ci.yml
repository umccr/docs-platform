name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Strict build of the platform site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # The toolkit at DOCS_TOOLKIT_REF, from umccr/docs-toolkit, as the site pipeline installs it, then the same build
      # and checks as `make sites`. The toolkit's own tests and the strict builds of its examples run there.
      - name: Install the toolkit
        run: python -m venv .venv && make toolkit
      - name: Build and check
        run: make sites

  infrastructure:
    name: CDK app tests, lint and synth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm cdk synth --quiet

  repository:
    name: Workflows, secrets and information boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements/dev.txt
      - name: actionlint
        run: actionlint
      - name: zizmor
        run: zizmor --no-progress .github/workflows
      - name: detect-secrets
        run: git ls-files -z -- ':!pnpm-lock.yaml' | xargs -0 detect-secrets-hook --baseline .secrets.baseline
      - name: Information boundary
        run: scripts/check-boundary.sh
