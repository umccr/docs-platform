# pnpm blocks dependency lifecycle (postinstall) scripts by default. These packages
# ship native-binary build scripts that are not needed for `pnpm test` or `cdk synth`
# in this repo, so we keep them disabled to avoid the "Ignored build scripts" warning
# and to keep installs deterministic in CI and the pipeline.
#
# If a future task actually needs esbuild's native binary at runtime (rather than via
# ts-node/ts-jest transpilation), flip the relevant entry to `true` and re-run install.
allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  unrs-resolver: false

# Advisories with no patched version, which `pnpm audit` would otherwise fail on. Each reaches only the test tooling,
# never shipped code; remove an entry once a patched version or a jest without that path exists.
auditConfig:
  ignoreGhsas:
    # sprintf-js (moderate, denial of service), through jest's coverage plugin (babel-plugin-istanbul > js-yaml 3 >
    # argparse 1).
    - GHSA-hp3w-g68c-fv3c
    # deepmerge (low, prototype poisoning), which jest-config uses to merge jest's own configuration.
    - GHSA-gcqx-w48m-w2h4

# Patched versions forced past the ranges the packages ask for (`make audit-fix`), each held to its major version:
# minimatch 11.0.1 (GHSA-g3hv-75wg-m249, a pattern's denial of service), under eslint, glob and jest, and glob 14.0.2
# (GHSA-3g3m-2fjr-6pw4, a cancelled walk that keeps reading), under jest. The dispatcher asks for minimatch 11 itself.
# Remove an entry once nothing asks for an older version.
overrides:
  glob@>=9.0.0 <=14.0.1: ^14.0.2
  minimatch@<11.0.1: ^11.0.1
