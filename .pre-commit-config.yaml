# The repository's checks. `make install` installs them as the git pre-commit hook, `make check` runs them on every
# tracked file, and CI runs them too (.github/workflows/ci.yml). Each hook is pinned to a commit, with its version in
# the comment: `pre-commit autoupdate --freeze` moves them. pre-commit itself: https://pre-commit.com/#install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-yaml
        args: ['--unsafe'] # mkdocs.yml may hold tags the contract then rejects with a clearer message
      # Design pages exported from the design documents stay byte for byte as exported.
      - id: end-of-file-fixer
        exclude: ^docs/design/(?!adr/)
      - id: trailing-whitespace
        exclude: ^docs/design/(?!adr/)
      - id: detect-private-key
      - id: detect-aws-credentials
        args: ['--allow-missing-credentials']

  - repo: https://github.com/Yelp/detect-secrets
    rev: 01886c8a910c64595c47f186ca1ffc0b77fa5458  # frozen: v1.5.0
    hooks:
      # Not the lockfile's integrity hashes, nor this file's commit SHAs: both read as high-entropy strings.
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: ^(pnpm-lock\.yaml|\.pre-commit-config\.yaml)$

  # The workflows: actionlint for mistakes, zizmor for security problems.
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
    hooks:
      - id: zizmor

  # The CDK app's lint and formatting, with its own packages; CI runs them in the CDK job, which installs them.
  - repo: local
    hooks:
      - id: eslint
        name: eslint (CDK app)
        entry: pnpm lint
        language: system
        pass_filenames: false
        files: ^(bin|infrastructure|app|test)/|^(eslint\.config\.mjs|tsconfig\.json)$
      - id: prettier
        name: prettier (CDK app)
        entry: pnpm format:check
        language: system
        pass_filenames: false
        files: ^(bin|infrastructure|app|test)/
