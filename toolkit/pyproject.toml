[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "umccr-docs"
version = "0.1.0"
description = "Check, build and publish UMCCR documentation sites for docs.umccr.org"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
# The documentation engine and its extensions are pinned, with hashes, in ../requirements/build.txt.
dependencies = [
  "PyYAML>=6.0",
  "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
umccr-docs = "umccr_docs.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/umccr_docs"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
# assert is the pytest idiom; subprocess calls use fixed argument lists.
ignore = ["S101", "S603", "S607"]
